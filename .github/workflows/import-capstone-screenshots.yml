name: Import capstone screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-capstone-screenshots.yml'

permissions:
  contents: write

jobs:
  import-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out My Fit Ideas main branch as a temporary source
        uses: actions/checkout@v4
        with:
          repository: james-lasersoft/myfitideas
          ref: main
          path: _source
          persist-credentials: false

      - name: Select and copy existing capstone screenshots
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, shutil, zipfile

          source = Path('_source')
          target = Path('projects/my-fit-ideas/media/screenshots')
          target.mkdir(parents=True, exist_ok=True)

          # Remove only screenshots previously generated by this workflow.
          for p in target.iterdir():
              if p.is_file():
                  p.unlink()

          image_exts = {'.png', '.jpg', '.jpeg', '.webp'}
          keywords = {
              'dashboard': 8,
              'progress': 8,
              'hydration': 8,
              'chart': 7,
              'authentication': 7,
              'auth': 6,
              'login': 6,
              'measurement': 5,
              'profile': 4,
              'screenshot': 4,
          }

          candidates = []

          # First preference: existing image assets used by the capstone project/report.
          for p in source.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in image_exts:
                  continue
              low_parts = [part.lower() for part in p.parts]
              if any(part in {'node_modules', 'dist', 'build', '.git'} for part in low_parts):
                  continue
              name = p.name.lower()
              score = sum(weight for key, weight in keywords.items() if key in name)
              if 'images' in low_parts or 'docs' in low_parts:
                  score += 2
              candidates.append((score, p.stat().st_size, p))

          # If a DOCX capstone report is present in the repository, extract embedded images
          # as an additional source. This does not copy the report or any source code.
          extracted = Path('/tmp/capstone-docx-media')
          extracted.mkdir(parents=True, exist_ok=True)
          for docx in source.rglob('*.docx'):
              n = docx.name.lower()
              if not any(k in n for k in ('capstone', 'msit5910', 'assignment_activity_07')):
                  continue
              try:
                  with zipfile.ZipFile(docx) as z:
                      for member in z.namelist():
                          if not member.startswith('word/media/'):
                              continue
                          ext = Path(member).suffix.lower()
                          if ext not in image_exts:
                              continue
                          out = extracted / f'{docx.stem}-{Path(member).name}'
                          out.write_bytes(z.read(member))
                          score = sum(weight for key, weight in keywords.items() if key in out.name.lower()) + 1
                          candidates.append((score, out.stat().st_size, out))
              except zipfile.BadZipFile:
                  pass

          # De-duplicate by file bytes, rank relevant names first, then larger images.
          seen = set()
          selected = []
          for score, size, p in sorted(candidates, key=lambda x: (x[0], x[1]), reverse=True):
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              import hashlib
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen:
                  continue
              seen.add(digest)
              if score > 0:
                  selected.append((score, size, p, data))
              if len(selected) >= 7:
                  break

          # If filenames provide no useful clues, use the largest distinct image assets.
          if len(selected) < 4:
              selected = []
              seen = set()
              for score, size, p in sorted(candidates, key=lambda x: x[1], reverse=True):
                  try:
                      data = p.read_bytes()
                  except OSError:
                      continue
                  import hashlib
                  digest = hashlib.sha256(data).hexdigest()
                  if digest in seen or size < 25000:
                      continue
                  seen.add(digest)
                  selected.append((score, size, p, data))
                  if len(selected) >= 7:
                      break

          def slug(text):
              s = re.sub(r'[^a-z0-9]+', '-', text.lower()).strip('-')
              return s[:70] or 'screenshot'

          copied = []
          used_names = set()
          for i, (_, _, p, data) in enumerate(selected, 1):
              stem = slug(p.stem)
              out_name = f'{i:02d}-{stem}{p.suffix.lower()}'
              while out_name in used_names:
                  out_name = f'{i:02d}-{stem}-{len(used_names)+1}{p.suffix.lower()}'
              used_names.add(out_name)
              out = target / out_name
              out.write_bytes(data)
              copied.append(out)

          if not copied:
              raise SystemExit('No suitable screenshot images were found in the main branch.')

          # Build a simple gallery using only the selected image assets.
          def caption(filename):
              low = filename.lower()
              if 'hydration' in low:
                  return 'Hydration tracking and daily intake workflow'
              if 'progress' in low or 'chart' in low:
                  return 'Historical progress visualization and selectable chart view'
              if 'dashboard' in low:
                  return 'Authenticated dashboard and progress summary'
              if 'login' in low or 'auth' in low:
                  return 'Authentication and protected application access'
              if 'measurement' in low:
                  return 'Body measurement tracking workflow'
              if 'profile' in low:
                  return 'Profile settings and user preferences'
              return 'My Fit Ideas application evidence from the capstone project'

          gallery = Path('projects/my-fit-ideas/screenshots.md')
          lines = [
              '# My Fit Ideas Application Screenshots',
              '',
              'These screenshots reuse existing visual evidence from the My Fit Ideas capstone materials so the public portfolio remains consistent with the submitted project documentation. The gallery intentionally presents application evidence without publishing the complete application source code.',
              '',
              '> **Privacy note:** Public screenshots should not expose passwords, JWT values, database credentials, private email addresses, or other sensitive information. Images should be replaced or redacted if later review identifies any such content.',
              '',
          ]
          for out in copied:
              cap = caption(out.name)
              rel = f'media/screenshots/{out.name}'
              lines.extend([
                  f'## {cap}',
                  '',
                  f'![{cap}]({rel})',
                  '',
              ])
          gallery.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          # Add a discoverable screenshot section to the project case study.
          project_readme = Path('projects/my-fit-ideas/README.md')
          if project_readme.exists():
              text = project_readme.read_text(encoding='utf-8')
              marker = '## Application Screenshots'
              block = (
                  '\n\n## Application Screenshots\n\n'
                  'Selected screenshots from the capstone documentation are available in the '
                  '[application screenshot gallery](screenshots.md). They demonstrate the implemented '
                  'user workflows and visual outputs while keeping the complete source code outside this portfolio.\n'
              )
              if marker not in text:
                  text = text.rstrip() + block + '\n'
                  project_readme.write_text(text, encoding='utf-8')

          # Add a lightweight link from the portfolio landing README if it is not already present.
          root_readme = Path('README.md')
          if root_readme.exists():
              text = root_readme.read_text(encoding='utf-8')
              link = '[View application screenshots](projects/my-fit-ideas/screenshots.md)'
              if link not in text:
                  text = text.rstrip() + '\n\n## Capstone Visual Evidence\n\n' + link + '\n'
                  root_readme.write_text(text, encoding='utf-8')

          print(f'Copied {len(copied)} screenshot image(s).')
          PY

          # The source repository checkout is temporary and must never be committed.
          rm -rf _source

      - name: Commit imported screenshots and gallery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects/my-fit-ideas/README.md projects/my-fit-ideas/screenshots.md projects/my-fit-ideas/media/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Add capstone application screenshots to portfolio"
            git push origin main
          fi
