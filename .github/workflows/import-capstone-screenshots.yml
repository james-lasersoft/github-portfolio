name: Capture capstone screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-capstone-screenshots.yml'

permissions:
  contents: write

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out My Fit Ideas main branch as temporary source
        uses: actions/checkout@v4
        with:
          repository: james-lasersoft/myfitideas
          ref: main
          path: _source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: _source/src/frontend/package-lock.json

      - name: Install frontend and screenshot dependencies
        working-directory: _source/src/frontend
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start current main-branch frontend
        working-directory: _source/src/frontend
        shell: bash
        run: |
          VITE_API_URL=/mock-api npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/myfitideas-vite.log 2>&1 &
          echo $! > /tmp/myfitideas-vite.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then
              echo "Frontend is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/myfitideas-vite.log
          exit 1

      - name: Capture portfolio screenshots from the running application
        working-directory: _source/src/frontend
        env:
          PORTFOLIO_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          cat > capture-portfolio.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.env.PORTFOLIO_ROOT;
          const outDir = path.join(root, 'projects', 'my-fit-ideas', 'media', 'screenshots');
          fs.mkdirSync(outDir, { recursive: true });

          for (const entry of fs.readdirSync(outDir)) {
            if (entry.toLowerCase().endsWith('.png')) {
              fs.unlinkSync(path.join(outDir, entry));
            }
          }

          const today = new Date().toISOString().slice(0, 10);
          const todayLoggedAt = `${today}T22:00:00.000Z`;

          const profile = {
            id: 'portfolio-demo-user',
            email: 'demo@example.com',
            firstName: 'James',
            lastName: 'Arnold',
            heightCm: 187.96,
            preferredWeightUnit: 'lb',
            preferredHydrationUnit: 'oz',
            dailyHydrationGoal: 64,
            targetWeight: 210,
            createdAt: '2026-07-01T12:00:00.000Z',
            updatedAt: '2026-07-15T12:00:00.000Z'
          };

          const measurements = [
            { id: 'm1', weight: 228, waist: 43, chest: 45, hips: 42, bodyFat: 28.0, measurementDate: '2026-07-11T12:00:00.000Z' },
            { id: 'm2', weight: 227, waist: 42, chest: 44, hips: 41, bodyFat: 27.5, measurementDate: '2026-07-12T12:00:00.000Z' },
            { id: 'm3', weight: 228, waist: 42, chest: 44, hips: 41, bodyFat: 28.0, measurementDate: '2026-07-13T12:00:00.000Z' },
            { id: 'm4', weight: 240, waist: 41, chest: 44, hips: 40, bodyFat: 28.8, measurementDate: '2026-07-14T12:00:00.000Z' },
            { id: 'm5', weight: 241, waist: 42, chest: 45, hips: 41, bodyFat: 30.0, measurementDate: '2026-07-15T12:00:00.000Z' }
          ];

          const hydration = [
            {
              id: 'h1', userId: profile.id, amount: 16, unit: 'oz', loggedAt: todayLoggedAt,
              createdAt: todayLoggedAt, updatedAt: todayLoggedAt
            },
            {
              id: 'h2', userId: profile.id, amount: 12, unit: 'oz', loggedAt: '2026-07-13T16:00:00.000Z',
              createdAt: '2026-07-13T16:00:00.000Z', updatedAt: '2026-07-13T16:00:00.000Z'
            },
            {
              id: 'h3', userId: profile.id, amount: 20, unit: 'oz', loggedAt: '2026-07-14T18:00:00.000Z',
              createdAt: '2026-07-14T18:00:00.000Z', updatedAt: '2026-07-14T18:00:00.000Z'
            }
          ];

          const dashboard = {
            currentWeight: 241,
            previousWeight: 240,
            weightDifference: 1,
            bmi: 31.3,
            bmiCategory: 'Obesity',
            todayWaterOz: 16,
            todayWaterMl: 473,
            lastMeasurementDate: '2026-07-15T12:00:00.000Z',
            preferredWeightUnit: 'lb',
            preferredHydrationUnit: 'oz',
            dailyHydrationGoal: 64,
            targetWeight: 210
          };

          function json(body, status = 200) {
            return {
              status,
              contentType: 'application/json',
              headers: { 'Cache-Control': 'no-store' },
              body: JSON.stringify(body)
            };
          }

          async function installMockApi(page) {
            await page.route('**/mock-api/**', async route => {
              const request = route.request();
              const url = new URL(request.url());
              const apiPath = url.pathname.replace(/^\/mock-api/, '');
              const method = request.method();

              if (apiPath === '/api/dashboard' && method === 'GET') {
                return route.fulfill(json(dashboard));
              }

              if (apiPath === '/api/measurements' && method === 'GET') {
                return route.fulfill(json({ measurements }));
              }

              if (apiPath === '/api/hydration/daily-total' && method === 'GET') {
                return route.fulfill(json({
                  date: url.searchParams.get('date') ?? today,
                  totalMl: 473.176,
                  totalOz: 16,
                  entries: [hydration[0]]
                }));
              }

              if (apiPath === '/api/hydration' && method === 'GET') {
                return route.fulfill(json({ hydration }));
              }

              if (apiPath === '/api/profile' && method === 'GET') {
                return route.fulfill(json({ profile }));
              }

              if (apiPath === '/api/auth/login' && method === 'POST') {
                return route.fulfill(json({
                  message: 'Login successful',
                  token: 'portfolio-demo-token',
                  user: profile
                }));
              }

              return route.fulfill(json({ message: 'Portfolio demonstration response' }));
            });
          }

          const browser = await chromium.launch();
          const base = 'http://127.0.0.1:5173';

          // Public authentication screen. Replace prefilled development credentials before capture.
          const publicContext = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const loginPage = await publicContext.newPage();
          await installMockApi(loginPage);
          await loginPage.goto(`${base}/`, { waitUntil: 'domcontentloaded' });
          await loginPage.locator('#email').fill('demo@example.com');
          await loginPage.locator('#password').fill('');
          await loginPage.getByRole('button', { name: 'Sign In' }).waitFor();
          await loginPage.screenshot({ path: path.join(outDir, 'login.png'), fullPage: true });
          await publicContext.close();

          // Protected screens use non-sensitive demonstration state and API responses.
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          await context.addInitScript(() => {
            localStorage.setItem('authToken', 'portfolio-demo-token');
            localStorage.setItem('currentUser', JSON.stringify({ firstName: 'James', email: 'demo@example.com' }));
            localStorage.setItem('hydrationGoalOz', '64');
          });
          const page = await context.newPage();
          await installMockApi(page);

          async function capture(urlPath, filename, requiredText, extraWait = 600) {
            await page.goto(`${base}${urlPath}`, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(text => document.body.innerText.includes(text), requiredText);
            await page.waitForTimeout(extraWait);
            await page.screenshot({ path: path.join(outDir, filename), fullPage: true });
          }

          await capture('/dashboard', 'dashboard.png', 'Current Weight');
          await capture('/hydration', 'hydration.png', 'Hydration Tracking');
          await capture('/progress', 'progress-charts.png', 'Progress Charts', 1500);

          await context.close();
          await browser.close();

          console.log(`Captured ${fs.readdirSync(outDir).filter(name => name.endsWith('.png')).length} screenshots.`);
          JS

          node capture-portfolio.mjs

      - name: Build screenshot gallery and portfolio links
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          gallery = Path('projects/my-fit-ideas/screenshots.md')
          gallery.write_text('''# My Fit Ideas Application Screenshots

These screenshots are captured from the current `main` branch user interface using non-sensitive demonstration data aligned with examples shown in the capstone report. This keeps the portfolio visually consistent with the submitted project while avoiding publication of the complete application source code or private user data.

## Login and Protected Access

![My Fit Ideas login screen](media/screenshots/login.png)

The authentication screen provides the entry point to protected application features. Portfolio capture uses a demonstration email address and no password value.

## Dashboard Summary and Navigation

![My Fit Ideas authenticated dashboard](media/screenshots/dashboard.png)

The dashboard combines current weight, daily hydration, BMI, last-measurement information, and direct navigation to the primary modules. Demonstration values mirror the capstone report examples, including a current weight of 241 lb and BMI of 31.3.

## Hydration Tracking

![My Fit Ideas hydration tracking page](media/screenshots/hydration.png)

The hydration page demonstrates daily totals, entry controls, progress toward the configured goal, and hydration history.

## Progress Analytics

![My Fit Ideas progress charts page](media/screenshots/progress-charts.png)

The progress view converts historical measurement and hydration records into selectable Chart.js visualizations for weight, body fat, body measurements, and daily hydration.

> **Privacy note:** The portfolio captures use demonstration data. Passwords, JWT values, database credentials, private email addresses, and personal health records are not displayed.
''', encoding='utf-8')

          project_readme = Path('projects/my-fit-ideas/README.md')
          text = project_readme.read_text(encoding='utf-8')
          marker = '## Application Screenshots'
          block = '''\n\n## Application Screenshots\n\n[View the application screenshot gallery](screenshots.md) for authentication, dashboard, hydration, and progress-chart evidence captured from the current `main` branch interface using non-sensitive demonstration data.\n'''
          if marker not in text:
              text = text.rstrip() + block + '\n'
              project_readme.write_text(text, encoding='utf-8')

          root_readme = Path('README.md')
          text = root_readme.read_text(encoding='utf-8')
          link = '[View application screenshots](projects/my-fit-ideas/screenshots.md)'
          if link not in text:
              text = text.rstrip() + '\n\n## Capstone Visual Evidence\n\n' + link + '\n'
              root_readme.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary application checkout
        shell: bash
        run: rm -rf _source

      - name: Verify screenshot files
        shell: bash
        run: |
          test -s projects/my-fit-ideas/media/screenshots/login.png
          test -s projects/my-fit-ideas/media/screenshots/dashboard.png
          test -s projects/my-fit-ideas/media/screenshots/hydration.png
          test -s projects/my-fit-ideas/media/screenshots/progress-charts.png
          test -s projects/my-fit-ideas/screenshots.md
          ls -lh projects/my-fit-ideas/media/screenshots

      - name: Commit screenshots and gallery to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects/my-fit-ideas/README.md projects/my-fit-ideas/screenshots.md projects/my-fit-ideas/media/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Publish My Fit Ideas application screenshots"
            git push origin main
          fi
